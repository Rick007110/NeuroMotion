[package]
name = "neuromotion"
version = "0.1.0"
edition = "2024"
description = "A timeline-based motion editor for physically simulated character animation that opens endorphin scenes."
license = "GPL-3.0-or-later"
repository = "https://github.com/Rick007110/NeuroMotion"
readme = "README.md"

[dependencies]
eframe = "0.31"
flate2 = "1.1.10"
glam = "0.30"
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
