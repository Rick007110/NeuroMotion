# Builds the app for Windows, macOS and Linux and attaches it to a GitHub pre-release.
# Start one either way:
# - Actions → Release → Run workflow, with a version such as v0.2.0: the release and
#   its tag are made from the branch you run it on;
# - or push a version tag: git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (becomes the tag)"
        required: true

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            binary: neuromotion.exe
          - name: macos-arm64
            os: macos-latest
            binary: neuromotion
          - name: linux-x64
            os: ubuntu-latest
            binary: neuromotion
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check the version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "Version must look like v1.2.3 or v1.2.3-beta.1, not '$VERSION'"; exit 1; }
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          dir="neuromotion-${VERSION}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.binary }}" README.md LICENSE "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release, or add the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Run by hand, the tag doesn't exist yet: --target makes it on the commit built.
          gh release view "$VERSION" > /dev/null 2>&1 \
            || gh release create "$VERSION" --target "$GITHUB_SHA" --title "NeuroMotion $VERSION (beta)" --generate-notes --prerelease
          gh release upload "$VERSION" dist/* --clobber

  announce:
    name: Announce on Discord
    needs: release
    uses: ./.github/workflows/discord.yml
    with:
      release_tag: ${{ inputs.version || github.ref_name }}
    secrets: inherit
