name: Bug report
description: Something doesn't work, crashes, or behaves differently than expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press Space at frame ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release number, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or log output
      description: >
        Your own NeuroMotion projects (.nmproj) are welcome. Don't attach endorphin's
        bundled files; name the scene instead.
  - type: checkboxes
    id: search
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true
