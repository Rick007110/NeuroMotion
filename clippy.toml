# The platform's maths library rounds these differently from one OS (or CPU) to the
# next, which turns into different simulations (docs/physics-design.md, lesson 30).
# Use the `libm` crate's functions instead (`libm::sinf(x)` for `x.sin()`), as glam does
# with its `libm` feature.
disallowed-methods = [
    { path = "f32::sin", reason = "use libm::sinf: identical on every platform" },
    { path = "f32::cos", reason = "use libm::cosf: identical on every platform" },
    { path = "f32::sin_cos", reason = "use libm::sincosf: identical on every platform" },
    { path = "f32::tan", reason = "use libm::tanf: identical on every platform" },
    { path = "f32::asin", reason = "use libm::asinf: identical on every platform" },
    { path = "f32::acos", reason = "use libm::acosf: identical on every platform" },
    { path = "f32::atan", reason = "use libm::atanf: identical on every platform" },
    { path = "f32::atan2", reason = "use libm::atan2f: identical on every platform" },
    { path = "f32::sinh", reason = "use libm::sinhf: identical on every platform" },
    { path = "f32::cosh", reason = "use libm::coshf: identical on every platform" },
    { path = "f32::tanh", reason = "use libm::tanhf: identical on every platform" },
    { path = "f32::exp", reason = "use libm::expf: identical on every platform" },
    { path = "f32::exp2", reason = "use libm::exp2f: identical on every platform" },
    { path = "f32::exp_m1", reason = "use libm::expm1f: identical on every platform" },
    { path = "f32::ln", reason = "use libm::logf: identical on every platform" },
    { path = "f32::ln_1p", reason = "use libm::log1pf: identical on every platform" },
    { path = "f32::log", reason = "use libm: identical on every platform" },
    { path = "f32::log2", reason = "use libm::log2f: identical on every platform" },
    { path = "f32::log10", reason = "use libm::log10f: identical on every platform" },
    { path = "f32::powf", reason = "use libm::powf: identical on every platform" },
    { path = "f32::powi", reason = "multiply instead: Windows (MSVC) debug builds call the platform's powf for it" },
    { path = "f64::powi", reason = "multiply instead: Windows (MSVC) debug builds call the platform's powf for it" },
    { path = "f32::hypot", reason = "use libm::hypotf: identical on every platform" },
    { path = "f32::cbrt", reason = "use libm::cbrtf: identical on every platform" },
    { path = "f32::asinh", reason = "use libm::asinhf: identical on every platform" },
    { path = "f32::acosh", reason = "use libm::acoshf: identical on every platform" },
    { path = "f32::atanh", reason = "use libm::atanhf: identical on every platform" },
    { path = "f32::mul_add", reason = "use libm::fmaf: without FMA hardware it calls the platform's fmaf" },
    { path = "f64::sin", reason = "use libm::sin: identical on every platform" },
    { path = "f64::cos", reason = "use libm::cos: identical on every platform" },
    { path = "f64::sin_cos", reason = "use libm::sincos: identical on every platform" },
    { path = "f64::tan", reason = "use libm::tan: identical on every platform" },
    { path = "f64::asin", reason = "use libm::asin: identical on every platform" },
    { path = "f64::acos", reason = "use libm::acos: identical on every platform" },
    { path = "f64::atan", reason = "use libm::atan: identical on every platform" },
    { path = "f64::atan2", reason = "use libm::atan2: identical on every platform" },
    { path = "f64::exp", reason = "use libm::exp: identical on every platform" },
    { path = "f64::ln", reason = "use libm::log: identical on every platform" },
    { path = "f64::sinh", reason = "use libm::sinh: identical on every platform" },
    { path = "f64::cosh", reason = "use libm::cosh: identical on every platform" },
    { path = "f64::tanh", reason = "use libm::tanh: identical on every platform" },
    { path = "f64::asinh", reason = "use libm::asinh: identical on every platform" },
    { path = "f64::acosh", reason = "use libm::acosh: identical on every platform" },
    { path = "f64::atanh", reason = "use libm::atanh: identical on every platform" },
    { path = "f64::exp2", reason = "use libm::exp2: identical on every platform" },
    { path = "f64::exp_m1", reason = "use libm::expm1: identical on every platform" },
    { path = "f64::ln_1p", reason = "use libm::log1p: identical on every platform" },
    { path = "f64::log", reason = "use libm: identical on every platform" },
    { path = "f64::log2", reason = "use libm::log2: identical on every platform" },
    { path = "f64::log10", reason = "use libm::log10: identical on every platform" },
    { path = "f64::mul_add", reason = "use libm::fma: without FMA hardware it calls the platform's fma" },
    { path = "f64::powf", reason = "use libm::pow: identical on every platform" },
    { path = "f64::hypot", reason = "use libm::hypot: identical on every platform" },
    { path = "f64::cbrt", reason = "use libm::cbrt: identical on every platform" },
]
